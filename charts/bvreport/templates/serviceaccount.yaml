{{- /*
  The ServiceAccount of the CronJob. Its identity is what courier authorizes: add
  system:serviceaccount:<namespace>:<name> to COURIER_AUTH_ALLOWED of courier.
  The API token is not mounted into the pod (automount off): the courier token comes from the
  projected volume of the job (audience courier).
*/ -}}
{{- $sa := index .Values "bv-job" "job" "serviceAccountName" }}
{{- if $sa }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    app.kubernetes.io/name: {{ $sa }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
automountServiceAccountToken: false
{{- end }}
