# Values of the go-job chart live under `bv-job:` (alias of the dependency).
# image.tag is written at release time (update-deployment-values); the default only keeps `helm template` working.
#
# bvreport counts the working days of the period and sends the report to Telegram through courier
# with its ServiceAccount token.
# Helm replaces lists: the Application in mm-deploy repeats the whole env list and secrets list.
bv-job:
  cronjob:
    enabled: true
    concurrencyPolicy: Replace
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 3
    schedule: "0 18 * * *"
    timeZone: Asia/Ho_Chi_Minh
  job:
    # created by this chart (templates/serviceaccount.yaml); courier must allow it
    serviceAccountName: bvreport
    podSecurityContext:
      runAsUser: 65532
      runAsNonRoot: true
    container:
      image:
        repository: huponx/bvreport
        tag: "0.0.0"
      env:
        - name: LOG_ENCODING
          value: json
        - name: SERVICE_NAME
          value: bvreport
        - name: COURIER_TARGET
          value: courier.application.svc.cluster.local:9090
        - name: COURIER_TOKEN_FILE
          value: /var/run/secrets/courier/token
        - name: GRPC_TLS_CA_FILE
          value: /var/run/tls/ca.crt
      volumeMounts:
        - name: courier-token
          mountPath: /var/run/secrets/courier
          readOnly: true
        - name: grpc-tls
          mountPath: /var/run/tls
          readOnly: true
    volumes:
      # In-cluster gRPC TLS (certificate of cert-manager, see the TLS section of courier/docs/setup-notification.md).
      # Optional: the pod starts without it, nothing reads it until GRPC_TLS_* / *_INSECURE=false are set.
      - name: grpc-tls
        secret:
          secretName: courier-grpc-tls
          optional: true
          items:
            - key: ca.crt
              path: ca.crt
      - name: courier-token
        projected:
          sources:
            - serviceAccountToken:
                audience: courier
                expirationSeconds: 3600
                path: token
  secrets: []
