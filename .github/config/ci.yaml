apps:
  - name: bvchain
    language: go
    cicd:
      jobs:
        containerize-and-package:
          image-name: bvchain
          dockerfile-path: build/bvchain/Dockerfile
          chart-path: charts/bvchain
          image-tag-paths:
            - .bv-job.job.container.image.tag
          trivy:
            severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
            ignore-unfixed: true
            exit-code: 0   # report only: the CVEs are listed in the PR comment, the build does not fail
  - name: bvreport
    language: go
    cicd:
      jobs:
        containerize-and-package:
          image-name: bvreport
          dockerfile-path: build/bvreport/Dockerfile
          chart-path: charts/bvreport
          image-tag-paths:
            - .bv-job.job.container.image.tag
          trivy:
            severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
            ignore-unfixed: true
            exit-code: 0   # report only: the CVEs are listed in the PR comment, the build does not fail
global:
  deploy:
    repo: huponx/mm-deploy
    base-branch: main
    file: "applications/{env}/{app}.yaml"
    set:
      - .spec.source.targetRevision
  environments:
    dev:
      workflows: [main]
      automerge: true
      labels: [automerge]
    staging:
      workflows: [staging]
      enabled: true
    production:
      workflows: [production]
      enabled: true
